<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#titleGrad); }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #f8fafc; }
      
      @keyframes pulseParticle {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.3); }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .node-pulse { animation: pulseParticle 4s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
      .flow-path { stroke-dasharray: 10, 10; animation: flowLine 15s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Dynamic/Animated Background Flows -->
  <g opacity="0.4">
    <path class="flow-path" d="M 100 80 Q 300 200 600 70 T 1100 220" fill="none" stroke="url(#lineGrad)" stroke-width="2"/>
    <path class="flow-path" d="M 50 220 Q 400 40 700 240 T 1150 90" fill="none" stroke="url(#lineGrad)" stroke-width="2" style="animation-duration: 20s;"/>
    
    <!-- Dynamic background node pulses -->
    <circle cx="150" cy="90" r="6" fill="#38bdf8" class="node-pulse" style="animation-delay: 0s;"/>
    <circle cx="450" cy="210" r="8" fill="#818cf8" class="node-pulse" style="animation-delay: 1s;"/>
    <circle cx="750" cy="110" r="5" fill="#c084fc" class="node-pulse" style="animation-delay: 2s;"/>
    <circle cx="1050" cy="200" r="7" fill="#38bdf8" class="node-pulse" style="animation-delay: 1.5s;"/>
  </g>

  <!-- Content Group (Ensured in Foreground) -->
  <g transform="translate(60, 0)">
    <!-- Header Badge -->
    <g transform="translate(0, 50)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#10b981"/>
      <text x="30" y="19" class="badge-text">iPaaS &amp; Automation Hub</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="125" class="title" filter="url(#glow)">Awesome Integration Platform as a Service</text>

    <!-- Subtitle -->
    <text x="0" y="165" class="subtitle">A Curated List of Enterprise iPaaS SaaS Products &amp; Open-Source Automation Engines</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 205)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
        <text x="16" y="21" class="badge-text" fill="#38bdf8">⚡ Visual Automation</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(185, 0)">
        <rect width="170" height="34" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
        <text x="16" y="21" class="badge-text" fill="#818cf8">🔗 API Orchestration</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(370, 0)">
        <rect width="170" height="34" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" opacity="0.9"/>
        <text x="16" y="21" class="badge-text" fill="#c084fc">🔓 Open-Source Engines</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(555, 0)">
        <rect width="170" height="34" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" opacity="0.9"/>
        <text x="16" y="21" class="badge-text" fill="#10b981">🤖 Agentic Workflows</text>
      </g>
    </g>
  </g>
</svg>
