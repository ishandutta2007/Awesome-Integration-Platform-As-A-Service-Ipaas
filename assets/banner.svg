<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="lineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".2"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".8"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseParticle{0%{opacity:.2;transform:scale(1)}50%{opacity:.8;transform:scale(1.3)}}@keyframes flowLine{0%{stroke-dashoffset:200}}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:url(#titleGrad)}.subtitle{font-weight:500;font-size:18px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#f8fafc}.node-pulse{animation:pulseParticle 4s infinite ease-in-out;transform-box:fill-box;transform-origin:center}.flow-path{stroke-dasharray:10,10;animation:flowLine 15s linear infinite}</style></defs><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><g opacity=".4"><path fill="none" stroke="url(#lineGrad)" stroke-width="2" d="M 100 80 Q 300 200 600 70 T 1100 220" class="flow-path"/><path fill="none" stroke="url(#lineGrad)" stroke-width="2" d="M 50 220 Q 400 40 700 240 T 1150 90" class="flow-path" style="animation-duration:20s"/><circle cx="150" cy="90" r="6" fill="#38bdf8" class="node-pulse" style="animation-delay:0s"/><circle cx="450" cy="210" r="8" fill="#818cf8" class="node-pulse" style="animation-delay:1s"/><circle cx="750" cy="110" r="5" fill="#c084fc" class="node-pulse" style="animation-delay:2s"/><circle cx="1050" cy="200" r="7" fill="#38bdf8" class="node-pulse" style="animation-delay:1.5s"/></g><g><g transform="translate(60, 0) translate(0, 50)"><rect width="210" height="28" fill="#1e293b" stroke="#334155" stroke-width="1" rx="14"/><circle cx="16" cy="14" r="5" fill="#10b981"/><text x="30" y="19" class="badge-text">iPaaS &amp; Automation Hub</text></g><text x="0" y="125" class="title" filter="url(#glow)" transform="translate(60, 0)">Awesome Integration Platform as a Service</text><text x="0" y="165" class="subtitle" transform="translate(60, 0)">A Curated List of Enterprise iPaaS SaaS Products &amp; Open-Source Automation Engines</text><g><g transform="translate(60, 0) translate(0, 205) translate(0, 0)"><rect width="170" height="34" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity=".9" rx="8"/><text x="16" y="21" fill="#38bdf8" class="badge-text">⚡ Visual Automation</text></g><g transform="translate(60, 0) translate(0, 205) translate(185, 0)"><rect width="170" height="34" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" opacity=".9" rx="8"/><text x="16" y="21" fill="#818cf8" class="badge-text">🔗 API Orchestration</text></g><g transform="translate(60, 0) translate(0, 205) translate(370, 0)"><rect width="170" height="34" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" opacity=".9" rx="8"/><text x="16" y="21" fill="#c084fc" class="badge-text">🔓 Open-Source Engines</text></g><g transform="translate(60, 0) translate(0, 205) translate(555, 0)"><rect width="170" height="34" fill="#0f172a" stroke="#10b981" stroke-width="1.5" opacity=".9" rx="8"/><text x="16" y="21" fill="#10b981" class="badge-text">🤖 Agentic Workflows</text></g></g></g></svg>